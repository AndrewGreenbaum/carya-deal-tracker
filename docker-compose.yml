version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: budtracker-db
    environment:
      POSTGRES_USER: bud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
      POSTGRES_DB: budtracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bud -d budtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
